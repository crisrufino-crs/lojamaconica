# Receita de publicação no Render (render.com): um site + um banco de dados, ambos no plano gratuito.
databases:
  - name: lojas-banco
    plan: free
    databaseName: lojas
    user: lojas

services:
  - type: web
    name: gestao-lojas
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi --workers 2 --timeout 60
    healthCheckPath: /saude/
    domains:
      - gestao.ordofraternus.com.br
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lojas-banco
          property: connectionString
      # Banco permanente (Neon). Preencha no painel do Render: Environment > BANCO_URL.
      - key: BANCO_URL
        sync: false
      # E-mail pela internet (o Render gratuito bloqueia SMTP). Chave do resend.com: Environment > RESEND_API_KEY.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        value: "Gestão da Loja <nao-responda@ordofraternus.com.br>"
